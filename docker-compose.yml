version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: phucthanh-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - phucthanh-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phucthanh-backend
    restart: unless-stopped
    ports:
      - "5799:8000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend:/app/backend
      - ./input:/app/input
    depends_on:
      - redis
    networks:
      - phucthanh-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phucthanh-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    env_file:
      - ./frontend/.env
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      - backend
    networks:
      - phucthanh-net

volumes:
  redis-data:

networks:
  phucthanh-net:
    driver: bridge
