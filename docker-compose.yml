version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phucthanh-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./input:/app/input
    networks:
      - phucthanh-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phucthanh-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - .env
      - ./frontend/.env
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      - backend
    networks:
      - phucthanh-net

networks:
  phucthanh-net:
    driver: bridge
