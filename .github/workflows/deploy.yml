name: Deploy to aaPanel Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Phuc Thanh Audio via SSH
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script_stop: true
          script: |
            PROJECT_DIR="${{ vars.PROJECT_PATH || '/www/dk_project/phucthanhaudio' }}"
            echo "🚀 Navigating to project directory: $PROJECT_DIR"

            if [ ! -d "$PROJECT_DIR" ]; then
              echo "❌ Directory $PROJECT_DIR does not exist!"
              exit 1
            fi

            cd "$PROJECT_DIR"

            echo "📥 Pulling latest changes from branch main..."
            git stash || true
            git pull origin main

            echo "🐳 Building and starting Docker containers..."
            docker compose up -d --build

            echo "🧹 Cleaning up dangling Docker images..."
            docker image prune -f

            echo "✅ Deployment completed successfully! Current running containers:"
            docker compose ps

